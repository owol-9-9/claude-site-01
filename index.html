<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f6">
<title>냥냥 미용실</title>
<style>
  :root {
    --pink: #ff8fb1;
    --pink-d: #e2708f;
    --pink-l: #ffe3ec;
    --line: #ffd3e0;
    --text: #5a4650;
    --muted: #a48d98;
    --yellow: #ffc94a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: #fff3f6;
    background-image: radial-gradient(#ffd9e5 1.6px, transparent 2px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    overflow-x: hidden;
  }
  .app {
    height: 100vh;
    height: 100dvh;
    min-height: 420px;
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 {
    font-size: clamp(20px, 5.6vw, 28px);
    font-weight: 900;
    color: var(--pink-d);
    letter-spacing: -.5px;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 6px; }
  .chip {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }

  .request {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 8px 12px;
    box-shadow: 0 3px 0 var(--line);
  }
  .request .avatar { font-size: 26px; line-height: 1; }
  .request .who { font-size: 15px; font-weight: 800; }
  .request .who small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .request p { font-size: 13px; line-height: 1.35; }

  .salon {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(104px, 28vw, 170px);
    gap: 10px;
  }
  .stage {
    position: relative;
    min-height: 0;
    border-radius: 26px;
    overflow: hidden;
    border: 3px solid var(--line);
    background:
      linear-gradient(to bottom, transparent 76%, #f6d9e3 76%),
      repeating-linear-gradient(90deg, #fff8fa 0 16px, #ffeef4 16px 32px);
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bubble {
    position: absolute;
    top: 10px;
    left: 50%;
    z-index: 2;
    max-width: 90%;
    background: #fff;
    border: 2px solid #ffc2d4;
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 800;
    text-align: center;
    line-height: 1.35;
    opacity: 0;
    transform: translate(-50%, -6px) scale(.9);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .now {
    position: absolute;
    left: 8px;
    bottom: 8px;
    z-index: 2;
    max-width: calc(100% - 16px);
    background: rgba(255, 255, 255, .88);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel h2 { font-size: 13px; text-align: center; color: var(--pink-d); }
  .cards {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  .card {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 3px 0 var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px;
    min-height: 0;
    animation: cardIn .35s ease-out backwards;
  }
  .card svg { flex: 1; min-height: 0; width: 100%; }
  .card span {
    font-size: 12px;
    font-weight: 800;
    line-height: 1.15;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .card.picked { border-color: var(--pink); background: var(--pink-l); }
  .panel.locked .cards, .panel.locked .ghost { opacity: .45; pointer-events: none; }
  @keyframes cardIn {
    from { opacity: 0; transform: scale(.8); }
  }
  .ghost {
    background: #fff;
    border: 2px dashed #ffb3c8;
    border-radius: 14px;
    padding: 8px 4px;
    font-size: 13px;
    font-weight: 800;
    color: var(--pink-d);
  }
  .ghost:active { background: var(--pink-l); }
  .primary {
    background: linear-gradient(#ff9fbd, #ff7fa6);
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: .5px;
    border-radius: 20px;
    padding: 14px;
    box-shadow: 0 4px 0 var(--pink-d);
  }
  .primary:disabled { filter: grayscale(.6); opacity: .55; cursor: default; }
  .primary:not(:disabled):active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-d); }

  /* result sheet */
  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    padding: 0 12px max(12px, env(safe-area-inset-bottom));
    transform: translateY(110%);
    transition: transform .45s cubic-bezier(.2, 1.3, .4, 1);
    pointer-events: none;
  }
  .sheet.show { transform: none; pointer-events: auto; }
  .sheet-card {
    max-width: 440px;
    max-height: 72dvh;
    overflow: auto;
    margin: 0 auto;
    background: #fff;
    border: 3px solid #ffc2d4;
    border-radius: 26px;
    padding: 16px 18px 14px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(226, 112, 143, .25);
  }
  .mood { font-size: 42px; line-height: 1; }
  .mood-title { font-size: 20px; font-weight: 900; color: var(--pink-d); margin-top: 4px; }
  .score-num { font-size: 44px; font-weight: 900; line-height: 1.1; }
  .score-num small { font-size: 18px; }
  .starrow { font-size: 26px; letter-spacing: 2px; }
  .starrow i { font-style: normal; color: #eadfe4; display: inline-block; }
  .starrow i.on { color: var(--yellow); animation: starPop .4s ease-out backwards; }
  @keyframes starPop {
    0% { transform: scale(0) rotate(-40deg); }
    70% { transform: scale(1.3); }
  }
  .reasons { font-size: 13.5px; line-height: 1.55; margin: 8px 0; }
  .prefs {
    font-size: 12px;
    color: var(--muted);
    background: #fff6f9;
    border-radius: 12px;
    padding: 6px 10px;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .sheet .primary { width: 100%; }

  /* svg animations */
  #fx text {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transform-box: fill-box;
    transform-origin: center;
    animation-fill-mode: both;
  }
  #cat { animation: breathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  #catWrap { transform-box: fill-box; transform-origin: 50% 100%; }
  #catWrap.enter { animation: enter .6s cubic-bezier(.3, 1.5, .5, 1) both; }
  #catWrap.shake { animation: shake .12s linear 5; }
  .tail { animation: swish 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 92%; }
  .eyes { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  .ear-r { animation: twitch 6s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .beat { animation: beat .8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .fx-snip { animation: snip .7s ease-in-out; }
  .fx-pop { animation: pop .8s ease-out; }
  .fx-rise { animation: rise 1.6s ease-out; }
  .fx-pulse { animation: pulse 1.4s ease-in-out; }
  .fx-drip { animation: drip 1.2s ease-in; }
  @keyframes breathe { 50% { transform: scale(1.01, 1.015); } }
  @keyframes enter { from { transform: scale(.4) translateY(40px); opacity: 0; } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes swish { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes twitch { 0%, 88%, 96%, 100% { transform: rotate(0); } 91% { transform: rotate(-12deg); } }
  @keyframes beat { 50% { transform: scale(1.2); } }
  @keyframes snip {
    0% { transform: translate(-70px, 10px) rotate(-20deg); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { transform: translate(70px, -6px) rotate(15deg); opacity: 0; }
  }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    40% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(.8); opacity: 0; }
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: 1; transform: translateY(-10px) scale(1); }
    100% { transform: translateY(-100px) scale(1.1); opacity: 0; }
  }
  @keyframes pulse {
    0% { transform: scale(0); opacity: 0; }
    20%, 60% { transform: scale(1.3); opacity: 1; }
    40%, 80% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }
  @keyframes drip {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(16px); opacity: 0; }
  }

  /* narrow phones */
  @media (max-width: 350px) {
    .salon { grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
    .card span { font-size: 11px; }
    .chip.best { display: none; }
    .request .avatar { display: none; }
  }
  /* phone landscape */
  @media (orientation: landscape) and (max-height: 540px) {
    .app { gap: 8px; }
    h1 { font-size: 20px; }
    .request { padding: 5px 10px; }
    .request p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .salon { grid-template-columns: minmax(0, 1fr) minmax(220px, 42%); }
    .cards { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .primary { padding: 10px; font-size: 16px; }
    .sheet-card { max-height: 92dvh; padding: 10px 16px; }
    .mood { font-size: 32px; }
    .score-num { font-size: 34px; }
  }
  @media (min-width: 700px) and (min-height: 700px) {
    .card span { font-size: 14px; }
    .request p { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #cat, .tail, .eyes, .ear-r, .beat { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>🐾 냥냥 미용실</h1>
    <div class="stats">
      <span class="chip">손님 <b id="served">0</b></span>
      <span class="chip">⭐ <b id="stars">0</b></span>
      <span class="chip best">최고 <b id="best">0</b></span>
    </div>
  </header>

  <section class="request">
    <div class="avatar">🐱</div>
    <div>
      <div class="who"><span id="custName"></span><small id="custBreed"></small></div>
      <p id="custReq"></p>
    </div>
  </section>

  <section class="salon">
    <div class="stage">
      <div class="bubble" id="bubble"></div>
      <svg viewBox="0 0 300 362" preserveAspectRatio="xMidYMax meet" aria-label="미용실 의자에 앉은 고양이">
        <defs>

          </pattern>
        </defs>
        <!-- salon chair -->
        <rect x="74" y="148" width="152" height="164" rx="34" fill="#ff9fbd" stroke="#e2708f" stroke-width="3"/>
        <rect x="88" y="162" width="124" height="128" rx="24" fill="#ffc6d7"/>
        <rect x="142" y="320" width="16" height="24" fill="#cfc9dc" stroke="#a9a2bb" stroke-width="2"/>

        <rect x="62" y="294" width="176" height="30" rx="15" fill="#ff9fbd" stroke="#e2708f" stroke-width="3"/>
        <g id="catWrap"><g id="cat"></g></g>
        <g id="fx"></g>
      </svg>
      <div class="now" id="now"></div>
    </div>

    <div class="panel" id="panel">
      <h2>💇 헤어 카탈로그</h2>
      <div class="cards" id="cards"></div>
      <button class="ghost" id="shuffleBtn">🔀 다른 스타일</button>
    </div>
  </section>

  <button class="primary" id="doneBtn" disabled>✨ 완성!</button>
</main>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="mood" id="moodEmoji"></div>
    <div class="mood-title" id="moodTitle"></div>
    <div class="score-num"><span id="scoreNum">0</span><small>점</small></div>

    <div class="reasons" id="reasons"></div>
    <div class="prefs" id="prefs"></div>
    <button class="primary" id="nextBtn">다음 손님 🐾</button>
  </div>
</div>

                  h.K('M184 90 L178 74') + h.G('M110 86 Q140 76 170 78') }

  const MOODS = [
    { min: 90, expr: 'love', emoji: '😻', title: '완전 반했다냥!', stars: 5,
      lines: ['이건 인생 헤어다냥!! 💕', '거울에서 눈을 못 떼겠다냥~', '단골 확정이다냥!'] },
    { min: 75, expr: 'happy', emoji: '😸', title: '마음에 든다냥!', stars: 4,
      lines: ['오~ 꽤 멋진데냥?', '기분이 아주 좋다냥 ♪', '친구들한테 자랑해야지!'] },
    { min: 55, expr: 'smile', emoji: '🐱', title: '나쁘지 않다냥', stars: 3,

    { min: 35, expr: 'meh', emoji: '😿', title: '좀 애매하다냥…', stars: 2,
      lines: ['이게… 맞는 거냥…?', '모자 쓰고 다녀야겠다냥', '털이 다시 자라겠지…'] },
    { min: 0, expr: 'angry', emoji: '😾', title: '하악! 화났다냥!', stars: 1,
      lines: ['이게 뭐냥!! 💢', '환불해달라냥!', '캣닢 안 줄 거다냥!'] }
  ];

  // ---------- drawing ----------
  const TAIL = 'M204 294 Q264 300 260 248 Q258 220 238 212';
  const CAPE_D = 'M116 182 Q150 198 184 182 L228 288 Q232 306 212 308 L88 308 Q68 306 72 288 Z';
  const CAPE =
    `<path d="${CAPE_D}" fill="#fff" stroke="#f0b6c8" stroke-width="3" stroke-linejoin="round"/>` +
    `<path d="${CAPE_D}" fill="url(#dots)"/>` +
    '<path d="M114 184 Q150 204 186 184 L182 196 Q150 214 118 196 Z" fill="#ffd1e0" stroke="#f0a2bb" stroke-width="2.5" stroke-linejoin="round"/>';
  const EYE_POS = [[124, 142], [176, 142]];

  function hairMarkup(hair, uid) {
    const st = STYLES[hair.style], col = COLORS[hair.color];
    const F = col.rainbow ? `url(#rb-${uid})` : col.hex;
    const D = col.rainbow ? '#a874d6' : shade(col.hex, -.3);
    const R = col.name === '핑크' || col.name === '불꽃' || col.rainbow ? '#6fb8ff' : '#ff6f9f';
    const h = {
      F, D, R,
      P: d => `<path d="${d}" fill="${F}" stroke="${D}" stroke-width="3" stroke-linejoin="round"/>`,
      C: (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${F}" stroke="${D}" stroke-width="3"/>`,
      G: d => `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>`,
      K: (d, op = 1) => `<path d="${d}" fill="none" stroke="${D}" stroke-width="2.5" stroke-linecap="round" opacity="${op}"/>`,
      bow: (x, y) => `<g transform="translate(${x} ${y})"><path d="M0 0 L-14 -9 L-14 9 Z M0 0 L14 -9 L14 9 Z" fill="${R}" stroke="${shade(R, -.25)}" stroke-width="2" stroke-linejoin="round"/><circle r="4" fill="${R}" stroke="${shade(R, -.25)}" stroke-width="2"/></g>`
    };
    const defs = col.rainbow
      ? `<linearGradient id="rb-${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset=".25" stop-color="#ffd36e"/><stop offset=".5" stop-color="#8ee6a6"/><stop offset=".75" stop-color="#8fc8ff"/><stop offset="1" stop-color="#c7a0ff"/></linearGradient>`
      : '';
    return { defs, back: st.back ? st.back(h) : '', front: st.front(h) };
  }

  function earsMarkup(b) {
    if (b.ears === 'fold') return '';
    const small = b.ears === 'small';
    const outer = small ? 'M100 114 L106 70 L138 92 Z' : 'M94 120 L96 54 L140 88 Z';
    const inner = small ? 'M107 104 L110 80 L128 94 Z' : 'M103 108 L104 70 L128 90 Z';
    const base = b.pattern === 'siamese' ? b.accent : b.fur;
    const colL = b.ears === 'calico' ? '#f2a65a' : base;
    const colR = b.ears === 'calico' ? '#4a4040' : base;
    const tuft = b.ears === 'tuft'
      ? `<path d="M96 56 L88 38 M97 56 L98 34 M98 57 L108 40" stroke="${b.accent}" stroke-width="3" stroke-linecap="round"/>` : '';
    const one = (c, cls) => `<g class="${cls}"><path d="${outer}" fill="${c}" stroke="${shade(c, -.3)}" stroke-width="3" stroke-linejoin="round"/><path d="${inner}" fill="#ffb6c8"/>${tuft}</g>`;
    return one(colL, 'ear-l') + `<g transform="matrix(-1 0 0 1 300 0)">${one(colR, 'ear-r')}</g>`;
  }

  function patternMarkup(b) {
    switch (b.pattern) {
      case 'tabby':
        return `<path d="M150 86 L150 106 M133 90 L137 106 M167 90 L163 106 M86 136 L102 140 M86 148 L101 149 M214 136 L198 140 M214 148 L199 149" stroke="${b.accent}" stroke-width="5" stroke-linecap="round"/>`;
      case 'siamese':
        return `<ellipse cx="150" cy="154" rx="38" ry="30" fill="${b.accent}" opacity=".8"/>`;
      case 'tuxedo':
        return '<ellipse cx="150" cy="166" rx="32" ry="22" fill="#fff"/><path d="M150 98 Q158 122 162 150 L138 150 Q142 122 150 98 Z" fill="#fff"/>';
      case 'calico':
        return '<circle cx="104" cy="104" r="40" fill="#f2a65a"/><circle cx="204" cy="118" r="30" fill="#4a4040"/><circle cx="178" cy="186" r="16" fill="#f2a65a"/>';
      default:
        return '';
    }
  }

  function eyesMarkup(b, expr) {
    const line = b.eyeLine || '#4a3a42';
    return EYE_POS.map(([x, y], i) => {
      switch (expr) {
        case 'happy':
          return `<path d="M${x - 10} ${y + 3} Q${x} ${y - 10} ${x + 10} ${y + 3}" fill="none" stroke="${line}" stroke-width="4" stroke-linecap="round"/>`;
        case 'love':
          return `<path class="beat" d="M${x} ${y + 9} C${x - 14} ${y} ${x - 10} ${y - 12} ${x} ${y - 5} C${x + 10} ${y - 12} ${x + 14} ${y} ${x} ${y + 9} Z" fill="#ff5c8a" stroke="#d93d6c" stroke-width="2"/>`;
        case 'meh':
          return `<path d="M${x - 10} ${y} A10 9 0 0 0 ${x + 10} ${y} Z" fill="${b.eye}" stroke="#3d3038" stroke-width="2"/><circle cx="${x}" cy="${y + 3}" r="3.5" fill="#2b2230"/><path d="M${x - 12} ${y} L${x + 12} ${y}" stroke="${line}" stroke-width="3.5" stroke-linecap="round"/>`;
        case 'angry': {
          const brow = i === 0 ? `M${x - 13} ${y - 17} L${x + 9} ${y - 9}` : `M${x + 13} ${y - 17} L${x - 9} ${y - 9}`;
          return `<ellipse cx="${x}" cy="${y}" rx="9" ry="8" fill="${b.eye}" stroke="#3d3038" stroke-width="2"/><ellipse cx="${x}" cy="${y}" rx="3" ry="6" fill="#2b2230"/><path d="${brow}" stroke="${line}" stroke-width="4" stroke-linecap="round"/>`;
        }
        default:
          return `<g class="eyes"><ellipse cx="${x}" cy="${y}" rx="10" ry="12" fill="${b.eye}" stroke="#3d3038" stroke-width="2"/><ellipse cx="${x}" cy="${y + 1}" rx="4.5" ry="8.5" fill="#2b2230"/><circle cx="${x - 3}" cy="${y - 5}" r="3.2" fill="#fff"/><circle cx="${x + 3}" cy="${y + 4}" r="1.5" fill="#fff"/></g>`;
      }
    }).join('');
  }

  function mouthMarkup(b, expr) {
    const m = b.mouth || '#4a3a42';
    const stem = `<path d="M150 159 L150 163" stroke="${m}" stroke-width="2.5" stroke-linecap="round"/>`;
    switch (expr) {
      case 'smile': case 'happy': case 'love':
        return stem + `<path d="M139 163 Q150 182 161 163 Q150 168 139 163 Z" fill="#ff7f9a" stroke="${m}" stroke-width="2.5" stroke-linejoin="round"/>`;
      case 'meh':
        return `<path d="M142 167 Q146 164 150 167 Q154 170 158 167" fill="none" stroke="${m}" stroke-width="2.5" stroke-linecap="round"/>`;
      case 'angry':
        return `<path d="M138 171 Q150 160 162 171" fill="none" stroke="${m}" stroke-width="2.5" stroke-linecap="round"/><path d="M142 168 L144 174 L146 166 Z M158 168 L156 174 L154 166 Z" fill="#fff" stroke="${m}" stroke-width="1.5" stroke-linejoin="round"/>`;
      default:
        return stem + `<path d="M140 162 Q145 168 150 163 Q155 168 160 162" fill="none" stroke="${m}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
  }

  function faceMarkup(b, expr) {
    const blushOp = expr === 'love' || expr === 'happy' ? .75 : .35;
    const blushCol = expr === 'angry' ? '#ff6b5e' : '#ff8fb1';
    const w = b.whisker || '#7a6570';
    return `<ellipse cx="104" cy="162" rx="11" ry="6.5" fill="${blushCol}" opacity="${blushOp}"/>` +
      `<ellipse cx="196" cy="162" rx="11" ry="6.5" fill="${blushCol}" opacity="${blushOp}"/>` +
      eyesMarkup(b, expr) +
      '<path d="M144.5 152 Q150 150 155.5 152 Q153 158 150 159 Q147 158 144.5 152 Z" fill="#ff8fa8"/>' +
      mouthMarkup(b, expr) +
      `<path d="M112 158 L80 152 M112 164 L80 166 M188 158 L220 152 M188 164 L220 166" stroke="${w}" stroke-width="2" stroke-linecap="round" opacity=".6"/>`;
  }

  function catMarkup(b, hair, expr, opt = {}) {
    const uid = opt.uid || 'm';
    const out = shade(b.fur, -.32);
    const hm = hair ? hairMarkup(hair, uid) : { defs: '', back: '', front: '' };
    let s = `<defs>${hm.defs}<clipPath id="hc-${uid}"><ellipse cx="150" cy="140" rx="66" ry="58"/></clipPath></defs>`;

    if (!opt.mini) {
      const tail = b.tail || (b.pattern === 'siamese' ? b.accent : b.fur);
      s += `<g class="tail"><path d="${TAIL}" fill="none" stroke="${shade(tail, -.32)}" stroke-width="24" stroke-linecap="round"/><path d="${TAIL}" fill="none" stroke="${tail}" stroke-width="18" stroke-linecap="round"/></g>`;
      s += CAPE;
      const paw = b.paw || (b.pattern === 'siamese' ? b.accent : b.fur);
      const pawOut = shade(paw, -.3);
      s += [126, 174].map(x =>
        `<ellipse cx="${x}" cy="306" rx="15" ry="10" fill="${paw}" stroke="${pawOut}" stroke-width="2.5"/>` +
        `<path d="M${x - 5} 309 L${x - 5} 314 M${x + 5} 309 L${x + 5} 314" stroke="${pawOut}" stroke-width="2" stroke-linecap="round"/>`
      ).join('');
    }

    s += hm.back;
    s += earsMarkup(b);
    if (b.fluff) {
      s += [[92, 162, 16], [104, 180, 16], [208, 162, 16], [196, 180, 16], [150, 194, 18], [126, 192, 16], [174, 192, 16]]
        .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${b.fur}" stroke="${out}" stroke-width="3"/>`).join('');
    }
    s += `<ellipse cx="150" cy="140" rx="66" ry="58" fill="${b.fur}"/>`;
    s += `<g clip-path="url(#hc-${uid})">${patternMarkup(b)}</g>`;
    s += `<ellipse cx="150" cy="140" rx="66" ry="58" fill="none" stroke="${out}" stroke-width="3"/>`;
    s += faceMarkup(b, expr);
    if (b.ears === 'fold') {
      const fold = `<path d="M100 100 Q96 72 126 78 Q126 94 106 106 Z" fill="${b.fur}" stroke="${out}" stroke-width="3" stroke-linejoin="round"/>`;
      s += fold + `<g transform="matrix(-1 0 0 1 300 0)">${fold}</g>`;
    }
    s += hm.front;
    return s;
  }

  // ---------- state ----------
  const catWrap = $('catWrap'), catG = $('cat'), fxG = $('fx');
  const cardsEl = $('cards'), panel = $('panel'), doneBtn = $('doneBtn');
  const bubble = $('bubble'), sheet = $('sheet');

  let breed, catName, hair, cards, changes, done, expr;
  let lastBreed = -1, uidSeq = 0, locked = false;
  let bubbleTimer, exprTimer;
  let stats = { served: 0, stars: 0, best: 0 };
  try { stats = Object.assign(stats, JSON.parse(storage.get('catsalon-stats')) || {}); } catch (e) {}

  function renderStats() {
    $('served').textContent = stats.served;
    $('stars').textContent = stats.stars;
    $('best').textContent = stats.best;
  }

  function renderCat() {
    catG.innerHTML = catMarkup(breed, hair, expr);
    $('now').textContent = hair
      ? `✂️ ${changes}회 · ${STYLES[hair.style].name} · ${COLORS[hair.color].name}`
      : '✂️ 아직 손질 전이에요';
  }

  function setExpr(e, revertMs) {
    clearTimeout(exprTimer);
    expr = e;
    renderCat();
    if (revertMs) exprTimer = setTimeout(() => { if (!done) { expr = 'normal'; renderCat(); } }, revertMs);
  }

  function say(text, ms = 2200) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('show');
    if (ms) bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  function fx(char, x, y, cls, size = 26, delay = 0) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('font-size', size);
    t.setAttribute('class', cls);
    t.style.animationDelay = delay + 'ms';
    t.textContent = char;
    fxG.appendChild(t);
    setTimeout(() => t.remove(), 1700 + delay);
  }

  function replay(cls) {
    catWrap.classList.remove('enter', 'shake');
    catWrap.getBoundingClientRect(); // restart animation
    catWrap.classList.add(cls);
  }

  function rerollCards() {
    const pool = STYLES.map((_, i) => i).filter(i => !hair || i !== hair.style);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = rand(i + 1);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    cards = pool.slice(0, 4).map(style => ({ style, color: rand(COLORS.length) }));
    cardsEl.innerHTML = cards.map((c, i) =>
      `<button class="card" data-i="${i}" style="animation-delay:${i * 60}ms" aria-label="${STYLES[c.style].name} ${COLORS[c.color].name}">` +
      `<svg viewBox="50 2 200 200" aria-hidden="true">${catMarkup(breed, c, 'normal', { mini: true, uid: 'c' + (uidSeq++) })}</svg>` +
      `<span>${STYLES[c.style].name}</span></button>`
    ).join('');
  }

  function newCustomer() {
    let bi;
    do { bi = rand(BREEDS.length); } while (bi === lastBreed);
    lastBreed = bi;
    breed = BREEDS[bi];
    catName = pick(NAMES);
    hair = null;
    changes = 0;
    done = false;
    locked = false;
    clearTimeout(exprTimer);
    expr = 'normal';
    fxG.innerHTML = '';

    $('custName').textContent = catName;
    $('custBreed').textContent = breed.breed;
    $('custReq').textContent = `“${breed.req}”`;
    sheet.classList.remove('show');
    panel.classList.remove('locked');
    doneBtn.disabled = true;

    renderCat();
    replay('enter');
    rerollCards();
    setTimeout(() => say(`나는 ${catName}! 잘 부탁해냥~`), 350);
  }

  function likeInfo(h) {
    const st = STYLES[h.style], col = COLORS[h.color];
    return {
      st, col,
      styleHits: st.tags.filter(t => breed.likes.includes(t)),
      colorHits: col.tags.filter(t => breed.likes.includes(t)),
      hatedStyle: st.tags.includes(breed.hates),
      hatedColor: col.tags.includes(breed.hates)
    };
  }

  // little hint of the cat's mood while styling
  function react() {
    const k = likeInfo(hair);
    const like = k.styleHits.length + k.colorHits.length * .5;
    if (changes > 9 && Math.random() < .5) {
      setExpr('meh', 1400);
      say(pick(['아직이냥…? 😪', '엉덩이 아프다냥…', '하암~ 졸리다냥']));
    } else if (k.hatedStyle) {
      setExpr('meh', 1400);
      fx('💧', 212, 106, 'fx-drip', 20, 200);
      say(pick(['으음… 그건 좀…', '냥…? 😓', '내 스타일은 아닌데…']));
    } else if (like >= 1.5) {
      setExpr('happy', 1400);
      fx('🎵', 220, 96, 'fx-rise', 20, 150);
      say(pick(['오…! 이거 좋다냥 ✨', '두근두근! 💗', '거울 좀 보여줘냥!']));
    } else if (like >= 1) {
      setExpr('smile', 1400);
      say(pick(['흠, 괜찮은데?', '나쁘지 않다냥', '오호~']));
    } else {
      setExpr('normal');
      say(pick(['흠흠…', '그냥 그렇다냥', '음… 글쎄?']));
    }
  }

  function applyHair(i) {
    if (done || locked || !cards[i]) return;
    locked = true;
    hair = cards[i];
    changes++;
    cardsEl.children[i].classList.add('picked');
    doneBtn.disabled = false;

    fx('✂️', 150, 66, 'fx-snip', 34);
    for (let n = 0; n < 5; n++) fx('✨', 96 + rand(108), 46 + rand(70), 'fx-pop', 18, 120 + n * 80);
    renderCat();
    react();

    setTimeout(() => { rerollCards(); locked = false; }, 280);
  }

  function evaluate() {
    const k = likeInfo(hair);
    const penalty = Math.min(15, Math.max(0, changes - 7) * 3);
    let score = 42 + rand(11) + k.styleHits.length * 18 + k.colorHits.length * 10
      - (k.hatedStyle ? 22 : 0) - (k.hatedColor ? 8 : 0) - penalty;
    score = Math.max(5, Math.min(100, score));
    return { ...k, penalty, score };
  }

  function finish() {
    if (!hair || done) return;
    done = true;
    panel.classList.add('locked');
    doneBtn.disabled = true;

    const r = evaluate();
    const mood = MOODS.find(m => r.score >= m.min);
    setExpr(mood.expr);
    say(pick(mood.lines), 0);

    if (mood.stars >= 4) {
      const icons = mood.stars === 5 ? ['💕', '💗', '💖'] : ['🎵', '✨', '💗'];
      for (let n = 0; n < 8; n++) fx(pick(icons), 84 + rand(132), 100 + rand(50), 'fx-rise', 22, n * 140);
      replay('enter');
    } else if (mood.stars === 1) {
      fx('💢', 208, 86, 'fx-pulse', 32);
      fx('💢', 92, 96, 'fx-pulse', 24, 300);
      replay('shake');
    } else if (mood.stars === 2) {
      fx('💧', 212, 106, 'fx-drip', 22, 100);
    }

    const reasons = [];
    if (r.styleHits.length) reasons.push(`💖 ${r.styleHits.map(t => TAG[t]).join('·')} 느낌, 딱 내 취향이다냥!`);
    if (r.colorHits.length) reasons.push(`🎨 ${r.col.name}색도 마음에 든다냥`);
    if (r.hatedStyle) reasons.push(`💔 ${TAG[breed.hates]} 스타일은 싫다고 했잖냥…`);
    if (r.hatedColor) reasons.push(`🙀 ${r.col.name}색은 좀 별로다냥`);
    if (r.penalty) reasons.push('😪 근데 너무 오래 걸렸다냥…');
    if (!reasons.length) reasons.push('🤔 내 취향이랑은 좀 거리가 있다냥');

    stats.served++;
    stats.stars += mood.stars;
    stats.best = Math.max(stats.best, r.score);
    storage.set('catsalon-stats', JSON.stringify(stats));

    setTimeout(() => {
      $('moodEmoji').textContent = mood.emoji;
      $('moodTitle').textContent = `${catName}: ${mood.title}`;
      $('reasons').innerHTML = reasons.join('<br>');
      $('prefs').textContent = `${catName}의 취향 · 좋아함: ${breed.likes.map(t => TAG[t]).join(', ')} / 싫어함: ${TAG[breed.hates]}`;
      $('starRow').innerHTML = [0, 1, 2, 3, 4]
        .map(n => n < mood.stars ? `<i class="on" style="animation-delay:${300 + n * 150}ms">★</i>` : '<i>★</i>').join('');
      sheet.classList.add('show');
      countUp($('scoreNum'), r.score);
      renderStats();
    }, 900);
  }

  function countUp(el, to) {
    const start = performance.now(), dur = 800;
    const step = now => {
      const p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // ---------- input ----------
  cardsEl.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) applyHair(+card.dataset.i);
  });
  $('shuffleBtn').addEventListener('click', () => {
    if (done || locked) return;
    rerollCards();
  });
  doneBtn.addEventListener('click', finish);
  $('nextBtn').addEventListener('click', () => {
    bubble.classList.remove('show');
    newCustomer();
  });

  // ---------- init ----------
  renderStats();
  newCustomer();
})();
</script>
</body>
</html>
